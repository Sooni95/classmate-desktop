<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>코코메이트 다운로드 신청자 목록 (관리자)</title>
<style>
  :root {
    --orange: #F68C1F; --orange-dark: #D9760F; --navy: #1F2733;
    --gray-600: #5B6472; --gray-200: #E7E9EC;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--navy); background: #FAFBFC; line-height: 1.5; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: var(--gray-600); margin-bottom: 24px; }

  .gate { max-width: 380px; margin: 80px auto; text-align: center; }
  .gate input {
    width: 100%; font-size: 14.5px; padding: 11px 13px; margin: 16px 0 10px;
    border: 1.5px solid var(--gray-200); border-radius: 9px; font-family: inherit;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-weight: 700; border-radius: 999px; border: none; cursor: pointer;
    background: var(--orange); color: #fff; padding: 11px 26px; font-size: 14.5px; width: 100%;
  }
  .btn:hover { background: var(--orange-dark); }
  .gate-error { color: #C0392B; font-size: 13px; margin-top: 8px; min-height: 16px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .count { font-size: 13.5px; color: var(--gray-600); }
  .count strong { color: var(--orange-dark); }
  .refresh {
    font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px;
    border: 1.5px solid var(--gray-200); background: #fff; cursor: pointer; color: var(--navy);
  }
  .refresh:hover { border-color: var(--orange); color: var(--orange-dark); }
  .toolbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toolbar-actions input[type="text"] {
    font-size: 13px; padding: 7px 12px; border: 1.5px solid var(--gray-200); border-radius: 8px;
    font-family: inherit; width: 180px;
  }
  .toolbar-actions input[type="text"]:focus { outline: none; border-color: var(--orange); }
  .toolbar-actions select {
    font-size: 13px; padding: 7px 10px; border: 1.5px solid var(--gray-200); border-radius: 8px;
    font-family: inherit; background: #fff; color: var(--navy); cursor: pointer;
  }
  .bulk-del-btn {
    font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px;
    border: 1.5px solid #C0392B; background: #fff; color: #C0392B; cursor: pointer;
  }
  .bulk-del-btn:hover:not(:disabled) { background: #FDECEA; }
  .bulk-del-btn:disabled { opacity: .4; cursor: default; }
  .level-tag {
    display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--gray-200); color: var(--navy); margin-left: 6px; white-space: nowrap;
  }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(31,39,51,.06); }
  th, td { padding: 11px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--gray-200); white-space: nowrap; }
  th { background: #F3F4F6; font-weight: 700; color: var(--navy); position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FFF8EF; }
  .yes { color: #1B8A5A; font-weight: 700; }
  .no { color: var(--gray-600); }
  .table-scroll { overflow-x: auto; border-radius: 12px; }
  .empty { text-align: center; color: var(--gray-600); font-size: 14px; padding: 60px 0; }
  .del-btn {
    font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 7px;
    border: 1.5px solid var(--gray-200); background: #fff; color: #C0392B; cursor: pointer;
  }
  .del-btn:hover { background: #FDECEA; border-color: #C0392B; }
</style>
</head>
<body>
<div class="wrap">

  <div class="gate" id="gate">
    <h1>🔒 관리자 인증</h1>
    <p class="sub">다운로드 신청자 목록을 보려면 관리자 토큰을 입력하세요.</p>
    <input type="password" id="tokenInput" placeholder="ADMIN_TOKEN" autocomplete="off">
    <button class="btn" id="gateBtn">확인</button>
    <div class="gate-error" id="gateError"></div>
  </div>

  <div id="content" hidden>
    <h1>📋 다운로드 신청자 목록</h1>
    <p class="sub">코코메이트 다운로드 페이지에서 수집된 정보입니다.</p>
    <div class="toolbar">
      <div class="count">총 <strong id="totalCount">0</strong>명 · 마케팅 동의 <strong id="marketingCount">0</strong>명</div>
      <div class="toolbar-actions">
        <input type="text" id="searchInput" placeholder="이름 · 소속 검색">
        <select id="levelFilter">
          <option value="">전체 학교급</option>
          <option value="초등">초등</option>
          <option value="중등">중등</option>
          <option value="고등">고등</option>
          <option value="기타">기타</option>
        </select>
        <button class="bulk-del-btn" id="bulkDeleteBtn" disabled>선택 삭제 (<span id="selCount">0</span>)</button>
        <button class="refresh" id="exportBtn">⬇ 엑셀 다운로드</button>
        <button class="refresh" id="refreshBtn">↻ 새로고침</button>
      </div>
    </div>
    <div class="table-scroll">
      <table id="leadTable" hidden>
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAllChk"></th>
            <th>신청일시</th><th>소속</th><th>성명</th><th>직급</th><th>전화번호</th><th>이메일</th><th>마케팅동의</th><th>OS</th><th></th>
          </tr>
        </thead>
        <tbody id="leadBody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" hidden>아직 신청자가 없어요.</div>
    </div>
  </div>

</div>

<script>
  var WORKER_BASE = (location.hostname === "classmate.kocoafab.cc")
    ? ""
    : "https://classmate-links.suhun099.workers.dev";

  var gate = document.getElementById('gate');
  var content = document.getElementById('content');
  var gateError = document.getElementById('gateError');
  var token = sessionStorage.getItem('cm_admin_token') || '';

  function fmtDate(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso || ''; }
  }

  // 별도 "학교급" 항목이 없어서, 소속(org) 텍스트에서 초등/중등/고등 키워드를 찾아 추정한다.
  function detectLevel(org) {
    org = org || '';
    if (/초등/.test(org)) return '초등';
    if (/중등|중학교/.test(org)) return '중등';
    if (/고등|고교/.test(org)) return '고등';
    return '기타';
  }

  var allLeads = [];
  var selectedKeys = new Set();

  function loadLeads() {
    gateError.textContent = '';
    return fetch(WORKER_BASE + '/api/admin/leads', { headers: { 'x-admin': token } })
      .then(function (res) {
        if (res.status === 401) throw new Error('토큰이 올바르지 않아요.');
        if (!res.ok) throw new Error('불러오기에 실패했어요 (HTTP ' + res.status + ')');
        return res.json();
      })
      .then(function (list) {
        gate.hidden = true;
        content.hidden = false;
        sessionStorage.setItem('cm_admin_token', token);

        allLeads = list;
        selectedKeys.clear();
        renderLeads();
      });
  }

  function getFilteredLeads() {
    var q = document.getElementById('searchInput').value.trim().toLowerCase();
    var level = document.getElementById('levelFilter').value;
    return allLeads.filter(function (r) {
      if (level && detectLevel(r.org) !== level) return false;
      if (q && (r.name || '').toLowerCase().indexOf(q) === -1 && (r.org || '').toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function updateBulkDeleteBtn() {
    var btn = document.getElementById('bulkDeleteBtn');
    document.getElementById('selCount').textContent = selectedKeys.size;
    btn.disabled = selectedKeys.size === 0;
  }

  function renderLeads() {
    var list = getFilteredLeads();
    var body = document.getElementById('leadBody');
    var table = document.getElementById('leadTable');
    var empty = document.getElementById('emptyMsg');
    body.innerHTML = '';

    if (!list.length) {
      table.hidden = true;
      empty.hidden = false;
    } else {
      table.hidden = false;
      empty.hidden = true;
      list.forEach(function (r) {
        var tr = document.createElement('tr');
        var checked = selectedKeys.has(r.key) ? 'checked' : '';
        tr.innerHTML =
          '<td><input type="checkbox" class="rowChk" data-key="' + escapeHtml(r.key) + '" ' + checked + '></td>' +
          '<td>' + fmtDate(r.date) + '</td>' +
          '<td>' + escapeHtml(r.org) + '<span class="level-tag">' + detectLevel(r.org) + '</span></td>' +
          '<td>' + escapeHtml(r.name) + '</td>' +
          '<td>' + escapeHtml(r.position) + '</td>' +
          '<td>' + escapeHtml(r.phone) + '</td>' +
          '<td>' + escapeHtml(r.email) + '</td>' +
          '<td class="' + (r.marketing ? 'yes' : 'no') + '">' + (r.marketing ? '동의' : '미동의') + '</td>' +
          '<td>' + escapeHtml(r.os || '') + '</td>' +
          '<td><button class="del-btn" data-key="' + escapeHtml(r.key) + '">삭제</button></td>';
        body.appendChild(tr);
      });
    }
    document.getElementById('totalCount').textContent = allLeads.length.toLocaleString('ko-KR');
    document.getElementById('marketingCount').textContent = allLeads.filter(function (r) { return r.marketing; }).length.toLocaleString('ko-KR');
    document.getElementById('selectAllChk').checked = list.length > 0 && list.every(function (r) { return selectedKeys.has(r.key); });
    updateBulkDeleteBtn();
  }

  function deleteByKeys(keys) {
    return Promise.all(keys.map(function (key) {
      return fetch(WORKER_BASE + '/api/admin/leads/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin': token },
        body: JSON.stringify({ key: key }),
      });
    }));
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  document.getElementById('leadBody').addEventListener('click', function (e) {
    var delBtn = e.target.closest('.del-btn');
    if (delBtn) {
      if (!confirm('이 신청자 정보를 삭제할까요? 되돌릴 수 없어요.')) return;
      delBtn.disabled = true;
      deleteByKeys([delBtn.dataset.key])
        .then(function () { loadLeads(); })
        .catch(function (err) { alert(err.message); delBtn.disabled = false; });
    }
  });

  document.getElementById('leadBody').addEventListener('change', function (e) {
    var chk = e.target.closest('.rowChk');
    if (!chk) return;
    if (chk.checked) selectedKeys.add(chk.dataset.key);
    else selectedKeys.delete(chk.dataset.key);
    document.getElementById('selectAllChk').checked =
      getFilteredLeads().length > 0 && getFilteredLeads().every(function (r) { return selectedKeys.has(r.key); });
    updateBulkDeleteBtn();
  });

  document.getElementById('selectAllChk').addEventListener('change', function (e) {
    var list = getFilteredLeads();
    if (e.target.checked) list.forEach(function (r) { selectedKeys.add(r.key); });
    else list.forEach(function (r) { selectedKeys.delete(r.key); });
    renderLeads();
  });

  document.getElementById('bulkDeleteBtn').addEventListener('click', function () {
    var keys = Array.from(selectedKeys);
    if (!keys.length) return;
    if (!confirm(keys.length + '명의 신청자 정보를 삭제할까요? 되돌릴 수 없어요.')) return;
    this.disabled = true;
    deleteByKeys(keys)
      .then(function () { loadLeads(); })
      .catch(function (err) { alert(err.message); })
      .finally(function () { updateBulkDeleteBtn(); });
  });

  document.getElementById('searchInput').addEventListener('input', renderLeads);
  document.getElementById('levelFilter').addEventListener('change', renderLeads);

  function csvCell(v) {
    var s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  document.getElementById('exportBtn').addEventListener('click', function () {
    var list = getFilteredLeads();
    if (!list.length) { alert('내보낼 데이터가 없어요.'); return; }
    var header = ['신청일시', '소속', '학교급', '성명', '직급', '전화번호', '이메일', '마케팅동의', 'OS'];
    var rows = list.map(function (r) {
      return [
        fmtDate(r.date), r.org, detectLevel(r.org), r.name, r.position,
        r.phone, r.email, (r.marketing ? '동의' : '미동의'), (r.os || ''),
      ].map(csvCell).join(',');
    });
    var csv = '﻿' + header.join(',') + '\n' + rows.join('\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = '코코메이트_다운로드신청자_' + stamp + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('gateBtn').addEventListener('click', function () {
    token = document.getElementById('tokenInput').value.trim();
    if (!token) { gateError.textContent = '토큰을 입력해 주세요.'; return; }
    var btn = this;
    btn.disabled = true; btn.textContent = '확인 중… (신청자 수에 따라 몇 초 걸릴 수 있어요)';
    loadLeads()
      .catch(function (err) { gateError.textContent = err.message; })
      .finally(function () { btn.disabled = false; btn.textContent = '확인'; });
  });
  document.getElementById('tokenInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('gateBtn').click();
  });
  document.getElementById('refreshBtn').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true; btn.textContent = '⏳ 불러오는 중…';
    loadLeads()
      .catch(function (err) { alert(err.message); })
      .finally(function () { btn.disabled = false; btn.textContent = '↻ 새로고침'; });
  });

  if (token) {
    document.getElementById('tokenInput').value = token;
    loadLeads().catch(function () { sessionStorage.removeItem('cm_admin_token'); token = ''; });
  }
</script>
</body>
</html>
